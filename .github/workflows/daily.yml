name: weekly-top5
on:
  schedule:
    - cron: '0 21 * * 0'   # Monday 06:00 KST (Sunday 21:00 UTC), once a week
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_claude_top5.py --out claude-top5.json
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-top5.json
          git diff --cached --quiet || git commit -m "Top 5 for $(date -u +%F)"
          git push
