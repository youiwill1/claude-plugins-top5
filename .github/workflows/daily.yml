name: daily-top5
on:
  schedule:
    - cron: '0 21 * * *'   # 06:00 KST
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python update_claude_top5.py --out claude-top5.json
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}   # optional: auto-find a video for new Top 5 plugins
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add claude-top5.json videos.json
          git diff --cached --quiet || git commit -m "Top 5 for $(date -u +%F)"
          git push
